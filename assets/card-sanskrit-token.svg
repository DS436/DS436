<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="sanskrit-token: tokenization research, arXiv 2609.12960">
  <style>
    .serif{font-family:Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif} .mono{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace} .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 7s cubic-bezier(0.77, 0, 0.175, 1) infinite both}@keyframes grow{0%{transform:scaleX(0)}22%{transform:scaleX(1)}86%{transform:scaleX(1);opacity:1}96%,100%{transform:scaleX(1);opacity:0}}
