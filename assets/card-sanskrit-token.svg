  <text x="32" y="94" class="serif" font-size="32" fill="#ede8dd" letter-spacing="-.5">sanskrit-token</text>
  <text x="32" y="132" class="sans" font-size="15" fill="#9a958a">Does Sanskrit's density survive</text><text x="32" y="155" class="sans" font-size="15" fill="#9a958a">subword tokenization? Measured per</text><text x="32" y="178" class="sans" font-size="15" fill="#9a958a">proposition against matched controls,</text><text x="32" y="201" class="sans" font-size="15" fill="#9a958a">with a paper built from the results.</text>
