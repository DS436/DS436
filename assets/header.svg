<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Devansh Sharma. Co-Founder at LayeredAI, building production RAG, agents and LLMOps.">
  <style>
    .serif{font-family:Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif} .mono{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    .rise{animation:rise 1.1s cubic-bezier(0.23, 1, 0.32, 1) both}
    @keyframes rise{from{transform:translateY(120px)}to{transform:translateY(0)}}
    .fade{animation:fade .9s cubic-bezier(0.23, 1, 0.32, 1) both}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
    @keyframes ring{0%{opacity:.6;transform:scale(1)}70%,100%{opacity:0;transform:scale(3.2)}}
    .hl{opacity:0;animation:hl 4.8s linear infinite}
    @keyframes hl{0%{opacity:0}4%{opacity:1}22%{opacity:0}100%{opacity:0}}
    .flow{stroke-dasharray:3 9;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <radialGradient id="glow" cx="88%" cy="100%" r="60%"><stop offset="0" stop-color="#e9743b" stop-opacity=".16"/><stop offset="1" stop-color="#e9743b" stop-opacity="0"/></radialGradient>
    <clipPath id="nameClip"><rect x="0" y="108" width="680" height="214"/></clipPath>
    <clipPath id="typeClip"><rect x="52" y="330" width="0" height="60"><animate attributeName="width" from="0" to="504" begin="1s" dur="2.2s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect width="1200" height="420" rx="14" fill="#0b0b0d"/>
  <rect width="1200" height="420" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="14" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="14" fill="none" stroke="#25252b"/>

  <g class="fade" style="animation-delay:.1s">
    <rect x="52" y="44" width="214" height="28" rx="14" fill="#111114" stroke="#25252b"/>
    <circle class="ring" cx="70" cy="58" r="4" fill="#7fb069"/>
    <circle cx="70" cy="58" r="4" fill="#7fb069"/>
    <text x="84" y="62" class="mono" font-size="12" letter-spacing="1.5" fill="#9a958a">SHIPPING · NEW YORK</text>
  </g>
  <g class="fade" style="animation-delay:.25s">
    <rect x="904" y="44" width="244" height="28" rx="14" fill="rgba(233,116,59,.08)" stroke="#3a2418"/>
    <rect x="916" y="51" width="38" height="14" rx="2" fill="#e9743b"/>
    <text x="935" y="62" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#0b0b0d">NEW</text>
    <text x="964" y="62" class="mono" font-size="12" letter-spacing="1.2" fill="#ede8dd">PAPER · ARXIV 2609.12960</text>
  </g>

  <g clip-path="url(#nameClip)">
    <text class="serif rise" style="animation-delay:.15s" x="48" y="208" font-size="104" font-weight="400" letter-spacing="-3" fill="#ede8dd">Devansh</text>
    <text class="serif rise" style="animation-delay:.3s" x="48" y="306" font-size="104" font-style="italic" font-weight="400" letter-spacing="-3" fill="#e9743b">Sharma</text>
  </g>

  <g clip-path="url(#typeClip)">
    <text x="52" y="352" class="mono" font-size="15" fill="#ede8dd">Co-Founder @ LayeredAI · production RAG, agents, LLMOps</text>
    <text x="52" y="378" class="mono" font-size="13" fill="#645f56">New York · provider-agnostic · Python + GCP</text>
  </g>
  <rect class="caret" x="52" y="338" width="8" height="18" fill="#e9743b">
    <animate attributeName="x" from="52" to="556" begin="1s" dur="2.2s" fill="freeze"/>
  </rect>

  <g class="fade" style="animation-delay:.5s">
    <path d="M760 149 H1060 V269 H760" fill="none" stroke="#25252b" stroke-width="1.5"/>
    <path class="flow" d="M760 149 H1060 V269 H760" fill="none" stroke="#e9743b" stroke-opacity=".55" stroke-width="1.5"/>
    <g>
      <rect x="700" y="130" width="120" height="38" rx="4" fill="#111114" stroke="#25252b"/>
      <rect class="hl" style="animation-delay:0s" x="700" y="130" width="120" height="38" rx="4" fill="rgba(233,116,59,.10)" stroke="#e9743b"/>
      <text x="760" y="154" text-anchor="middle" class="mono" font-size="12" letter-spacing="1.5" fill="#9a958a">INGEST</text>
    </g><g>
      <rect x="850" y="130" width="120" height="38" rx="4" fill="#111114" stroke="#25252b"/>
      <rect class="hl" style="animation-delay:1.0s" x="850" y="130" width="120" height="38" rx="4" fill="rgba(233,116,59,.10)" stroke="#e9743b"/>
      <text x="910" y="154" text-anchor="middle" class="mono" font-size="12" letter-spacing="1.5" fill="#9a958a">RETRIEVE</text>
    </g><g>
      <rect x="1000" y="130" width="120" height="38" rx="4" fill="#111114" stroke="#25252b"/>
      <rect class="hl" style="animation-delay:2.0s" x="1000" y="130" width="120" height="38" rx="4" fill="rgba(233,116,59,.10)" stroke="#e9743b"/>
      <text x="1060" y="154" text-anchor="middle" class="mono" font-size="12" letter-spacing="1.5" fill="#9a958a">RERANK</text>
    </g><g>
      <rect x="1000" y="250" width="120" height="38" rx="4" fill="#111114" stroke="#25252b"/>
      <rect class="hl" style="animation-delay:2.8s" x="1000" y="250" width="120" height="38" rx="4" fill="rgba(233,116,59,.10)" stroke="#e9743b"/>
      <text x="1060" y="274" text-anchor="middle" class="mono" font-size="12" letter-spacing="1.5" fill="#9a958a">AGENT</text>
    </g><g>
      <rect x="850" y="250" width="120" height="38" rx="4" fill="#111114" stroke="#25252b"/>
      <rect class="hl" style="animation-delay:3.8s" x="850" y="250" width="120" height="38" rx="4" fill="rgba(233,116,59,.10)" stroke="#e9743b"/>
      <text x="910" y="274" text-anchor="middle" class="mono" font-size="12" letter-spacing="1.5" fill="#9a958a">EVAL</text>
    </g><g>
      <rect x="700" y="250" width="120" height="38" rx="4" fill="#111114" stroke="#25252b"/>
      <rect class="hl" style="animation-delay:4.75s" x="700" y="250" width="120" height="38" rx="4" fill="rgba(233,116,59,.10)" stroke="#e9743b"/>
      <text x="760" y="274" text-anchor="middle" class="mono" font-size="12" letter-spacing="1.5" fill="#9a958a">SHIP</text>
    </g>
    <circle r="5" fill="#e9743b"><animateMotion dur="4.8s" repeatCount="indefinite" path="M760 149 H1060 V269 H760"/></circle>
    <circle r="11" fill="#e9743b" fill-opacity=".18"><animateMotion dur="4.8s" repeatCount="indefinite" path="M760 149 H1060 V269 H760"/></circle>
    <text x="700" y="330" class="mono" font-size="11" letter-spacing="1.5" fill="#645f56">PRODUCTION PIPELINE · TRACED END TO END</text>
  </g>
</svg>