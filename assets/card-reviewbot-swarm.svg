<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="reviewbot-swarm: multi-agent pull request reviewer">
  <style>
    .serif{font-family:Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif} .mono{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace} .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
    .gate{transform-box:fill-box;transform-origin:center;animation:gate 1.6s ease-out infinite}@keyframes gate{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
  <defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs>
  <rect x=".5" y=".5" width="599" height="299" rx="12" fill="#111114" stroke="#25252b"/>
  <text x="32" y="48" class="mono" font-size="11.5" letter-spacing="1.4" fill="#e9743b">MULTI-AGENT · PR REVIEW</text>
  <text x="32" y="94" class="serif" font-size="32" fill="#ede8dd" letter-spacing="-.5">reviewbot-swarm</text>
  <text x="32" y="132" class="sans" font-size="15" fill="#9a958a">Security, performance, style and</text><text x="32" y="155" class="sans" font-size="15" fill="#9a958a">test agents review a PR in parallel.</text><text x="32" y="178" class="sans" font-size="15" fill="#9a958a">A validator gate drops weak findings</text><text x="32" y="201" class="sans" font-size="15" fill="#9a958a">before anything gets posted.</text>
  <text x="32" y="270" class="mono" font-size="11" letter-spacing="1.2" fill="#645f56">TYPESCRIPT · ANTHROPIC · GITHUB API</text>
  <rect x="352" y="28" width="220" height="244" rx="8" fill="#0b0b0d" stroke="#25252b"/>
  <rect x="352" y="28" width="220" height="244" rx="8" fill="url(#g)"/>
  <text x="368" y="54" class="mono" font-size="9.5" letter-spacing="1.2" fill="#645f56">PARALLEL AGENTS → GATE</text>
<rect x="364" y="61" width="58" height="22" rx="3" fill="#111114" stroke="#25252b"/>
    <text x="393" y="75.5" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" letter-spacing=".6" fill="#9a958a">SECURITY</text>
    <path d="M424 72 C 452 72, 448 132, 478 132" fill="none" stroke="#25252b" stroke-width="1.2"/>
    <circle r="3.5" fill="#7fb069" opacity="0">
      <animateMotion dur="3.2s" begin="0.0s" repeatCount="indefinite" path="M424 72 C 452 72, 448 132, 478 132" keyPoints="0;1;1" keyTimes="0;.5;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="3.2s" begin="0.0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.08;.46;.52;1"/>
    </circle>
<rect x="364" y="101" width="58" height="22" rx="3" fill="#111114" stroke="#25252b"/>
    <text x="393" y="115.5" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" letter-spacing=".6" fill="#9a958a">PERF</text>
    <path d="M424 112 C 452 112, 448 132, 478 132" fill="none" stroke="#25252b" stroke-width="1.2"/>
    <circle r="3.5" fill="#7fb069" opacity="0">
      <animateMotion dur="3.2s" begin="0.35s" repeatCount="indefinite" path="M424 112 C 452 112, 448 132, 478 132" keyPoints="0;1;1" keyTimes="0;.5;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="3.2s" begin="0.35s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.08;.46;.52;1"/>
    </circle>
<rect x="364" y="141" width="58" height="22" rx="3" fill="#111114" stroke="#25252b"/>
    <text x="393" y="155.5" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" letter-spacing=".6" fill="#9a958a">STYLE</text>
    <path d="M424 152 C 452 152, 448 132, 478 132" fill="none" stroke="#25252b" stroke-width="1.2"/>
    <circle r="3.5" fill="#645f56" opacity="0">
      <animateMotion dur="3.2s" begin="0.7s" repeatCount="indefinite" path="M424 152 C 452 152, 448 132, 478 132" keyPoints="0;1;1" keyTimes="0;.5;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="3.2s" begin="0.7s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.08;.46;.52;1"/>
    </circle>
<rect x="364" y="181" width="58" height="22" rx="3" fill="#111114" stroke="#25252b"/>
    <text x="393" y="195.5" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" letter-spacing=".6" fill="#9a958a">TESTS</text>
    <path d="M424 192 C 452 192, 448 132, 478 132" fill="none" stroke="#25252b" stroke-width="1.2"/>
    <circle r="3.5" fill="#7fb069" opacity="0">
      <animateMotion dur="3.2s" begin="1.0499999999999998s" repeatCount="indefinite" path="M424 192 C 452 192, 448 132, 478 132" keyPoints="0;1;1" keyTimes="0;.5;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="3.2s" begin="1.0499999999999998s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.08;.46;.52;1"/>
    </circle>
<rect x="478" y="104" width="44" height="56" rx="4" fill="rgba(233,116,59,.08)" stroke="#e9743b"/>
  <rect class="gate" x="478" y="104" width="44" height="56" rx="4" fill="none" stroke="#e9743b" stroke-width="2"/>
  <text x="500" y="136" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" fill="#e9743b">GATE</text>
  <path d="M522 132 H556" stroke="#25252b" stroke-width="1.2"/>
  <circle r="3.5" fill="#e9743b"><animateMotion dur="1.6s" repeatCount="indefinite" path="M522 132 H556"/></circle>
  <rect x="528" y="176" width="36" height="22" rx="3" fill="#111114" stroke="#25252b"/>
  <text x="546" y="191" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" fill="#9a958a">PR</text>
  <path d="M556 132 V176" stroke="#25252b" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="368" y="236" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#645f56">WEAK FINDINGS DROPPED</text>
  <text x="368" y="252" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#645f56">BEFORE ANYTHING IS POSTED</text>
</svg>