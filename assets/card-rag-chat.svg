    <rect class="hot" style="animation-delay:0.0s" x="366" y="70" width="74" height="46" rx="4" fill="rgba(233,116,59,.08)" stroke="#e9743b"/>
    <rect x="376" y="82" width="48" height="4" rx="2" fill="#645f56"/><rect x="376" y="91" width="54" height="4" rx="2" fill="#2e2e35"/><rect x="376" y="100" width="38" height="4" rx="2" fill="#2e2e35"/>
    <text x="434" y="110" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8" fill="#e9743b">1</text>
