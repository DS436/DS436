    <rect x="376" y="202" width="48" height="4" rx="2" fill="#645f56"/><rect x="376" y="211" width="54" height="4" rx="2" fill="#2e2e35"/><rect x="376" y="220" width="38" height="4" rx="2" fill="#2e2e35"/>
    <text x="434" y="230" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8" fill="#e9743b">2</text>
