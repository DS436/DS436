  <text x="478" y="100" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" letter-spacing="1" fill="#645f56">ANSWER</text>
<rect class="ln" style="animation-delay:0.9s" x="478" y="110" width="70" height="4" rx="2" fill="#9a958a"/>
<rect class="ln" style="animation-delay:1.05s" x="478" y="121" width="62" height="4" rx="2" fill="#9a958a"/>
