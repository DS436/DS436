<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="rag-chat: document chat with inline citations">
  <style>
    .serif{font-family:Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif} .mono{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace} .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
    .hot{opacity:0;animation:hot 5s linear infinite}@keyframes hot{0%,8%{opacity:0}14%,80%{opacity:1}90%,100%{opacity:0}}.beam{stroke-dasharray:60;stroke-dashoffset:60;animation:beam 5s ease-out infinite}@keyframes beam{0%,10%{stroke-dashoffset:60}22%,80%{stroke-dashoffset:0;opacity:1}90%,100%{stroke-dashoffset:0;opacity:0}}.ln{transform-box:fill-box;transform-origin:left center;animation:ln 5s cubic-bezier(0.23, 1, 0.32, 1) infinite both}@keyframes ln{0%,10%{transform:scaleX(0)}18%,82%{transform:scaleX(1);opacity:1}92%,100%{transform:scaleX(1);opacity:0}}.chip{transform-box:fill-box;transform-origin:center;animation:chip 5s cubic-bezier(0.23, 1, 0.32, 1) infinite both}@keyframes chip{0%,14%{opacity:0;transform:scale(.8)}20%,82%{opacity:1;transform:scale(1)}92%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
  <defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs>
  <rect x=".5" y=".5" width="599" height="299" rx="12" fill="#111114" stroke="#25252b"/>
  <text x="32" y="48" class="mono" font-size="11.5" letter-spacing="1.4" fill="#e9743b">RAG · SOURCE-GROUNDED CHAT</text>
  <text x="32" y="94" class="serif" font-size="32" fill="#ede8dd" letter-spacing="-.5">rag-chat</text>
  <text x="32" y="132" class="sans" font-size="15" fill="#9a958a">Upload documents, ask questions,</text><text x="32" y="155" class="sans" font-size="15" fill="#9a958a">get answers with inline citations.</text><text x="32" y="178" class="sans" font-size="15" fill="#9a958a">Background ingestion, vector search,</text><text x="32" y="201" class="sans" font-size="15" fill="#9a958a">and every claim tied to a source.</text>
  <text x="32" y="270" class="mono" font-size="11" letter-spacing="1.2" fill="#645f56">NEXT.JS · FASTAPI · CHROMA · POSTGRES</text>
  <rect x="352" y="28" width="220" height="244" rx="8" fill="#0b0b0d" stroke="#25252b"/>
  <rect x="352" y="28" width="220" height="244" rx="8" fill="url(#g)"/>
  <text x="368" y="54" class="mono" font-size="9.5" letter-spacing="1.2" fill="#645f56">RETRIEVE → ANSWER</text>
