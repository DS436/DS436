  <g class="chip" style="animation-delay:1.85s"><rect x="504" y="168" width="22" height="16" rx="3" fill="rgba(233,116,59,.14)" stroke="#e9743b"/><text x="515" y="180" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#e9743b">2</text></g>
