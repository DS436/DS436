<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="SchedulerAI: a daily time ledger with an AI morning brief">
  <style>
    .serif{font-family:Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif} .mono{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace} .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
    .ring82{animation:ring82 6s cubic-bezier(0.77, 0, 0.175, 1) infinite both}@keyframes ring82{0%,8%{stroke-dashoffset:125.7}35%,88%{stroke-dashoffset:22.6}100%{stroke-dashoffset:125.7}}.fill{transform-box:fill-box;transform-origin:left center;animation:fill 6s cubic-bezier(0.23, 1, 0.32, 1) infinite both}@keyframes fill{0%,4%{transform:scaleX(0)}16%,88%{transform:scaleX(1);opacity:1}98%,100%{transform:scaleX(1);opacity:0}}.now{animation:now 6s linear infinite}@keyframes now{0%{transform:translateY(0)}88%{transform:translateY(140px);opacity:1}96%,100%{transform:translateY(140px);opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
