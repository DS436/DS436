  <text x="32" y="94" class="serif" font-size="32" fill="#ede8dd" letter-spacing="-.5">SchedulerAI</text>
  <text x="32" y="132" class="sans" font-size="15" fill="#9a958a">A daily ledger for where the time</text><text x="32" y="155" class="sans" font-size="15" fill="#9a958a">went. Timer, goals, calendar and</text><text x="32" y="178" class="sans" font-size="15" fill="#9a958a">WHOOP recovery become an AI</text><text x="32" y="201" class="sans" font-size="15" fill="#9a958a">morning brief and a plan.</text>
  <text x="32" y="270" class="mono" font-size="11" letter-spacing="1.2" fill="#645f56">NEXT.JS · PRISMA · NEXTAUTH · LLM</text>
  <rect x="352" y="28" width="220" height="244" rx="8" fill="#0b0b0d" stroke="#25252b"/>
  <rect x="352" y="28" width="220" height="244" rx="8" fill="url(#g)"/>
